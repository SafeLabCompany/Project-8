<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Safelab | Dashboard</title>
  <link rel="icon" type="image/png" href="../assets/institucional/safelab_recortada.svg">
</head>

<body>
  <div id="page-container">
    <div id="main-dash">
      <div id="user-area">
        <div id="user-img">
          <img src="../assets/dash/userIcon.svg">
        </div>
        <h2>Olá, <span id="user-name">usuário</span></h2>

        <div id="button-user">
          <div class="btn-href">
            <a href="dashboard.html">
              <h2>Dashboard</h2>
            </a>
          </div>
          <div class="btn-href">
            <a href="alertas.html">
              <h2>Alerta</h2>
            </a>
          </div>
          <div class="btn-href-active">
            <a href="suporte.html">
              <h2>Chamado</h2>
            </a>
          </div>
          <div class="btn-href">
            <a href="config.html">
              <h2>Configurações</h2>
            </a>
          </div>
          <div id="user-logout">
            Logout
          </div>
        </div>
      </div>
      <div id="container-suporte">
        <div id="header-dashboard">
          <img src="../assets/dash/notification.png" width="30px">
          <img src="../assets/dash/userIcon.png" width="30px">
        </div>
      <div id="area-suporte">
        <div id="barra-superior">
          <span id="texto-suporte">Suporte Digital</span>
        </div>
        <br>
        <div id="campos-input">
          Categorias de chamado: <br>
          <select name="" id="slct_categoria">
            <option value="">Ninguem decidiu</option>
          </select> <br><br>
          Nome completo: <br>
          <input type="text" id="ipt_nome"> <br><br>
          E-mail: <br>
          <input type="text" id="ipt_email"> <br><br>
          Assunto: <br>
          <input type="text" id="ipt_assunto"> <br><br>
          Descrição: <br>
          <input type="text" id="ipt_descricao"> <br><br>
        </div>
        <div id="botao-div">
          <button id="abrir_chamado">Abrir Chamado</button>
        </div>
      </div>
    </div>
    </div>
  </div>
</body>

</html>
