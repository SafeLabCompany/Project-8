<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Dashboard</title>
</head>

<body>
    <div id="page-container">
        <div id="main-dash">
            <div id="user-area">
                <div id="user-img">
                    <img src="../assets/userIcon.png">
                </div>
                Olá, <span id="user-name">usuário</span>
                <br>
                <div id="button-user">
                    <span id="user-dash">Dashboard</span>
                    <br>
                    <span id="user-alertas">Alertas</span>
                    <br>
                    <span id="user-registros">Registros</span>
                    <br>
                    <span id="user-call">Chamado</span>
                    <br>
                    <span id="user-config">Configurações</span>
                    <br><br>
                    <span id="user-logout">Logout</span>
                </div>
            </div>
            <div id="area-suporte">
                <div id="barra-superior">
                    <span id="texto-suporte">Suporte Digital</span>
                </div>
                <br>
                <div id="campos-input">
                    Categorias de chamado: <br>
                    <select name="" id="slct_categoria">
                        <option value="">Ninguem decidiu</option>
                    </select> <br><br>
                    Nome completo: <br>
                    <input type="text" id="ipt_nome"> <br><br>
                    E-mail: <br>
                    <input type="text" id="ipt_email"> <br><br>
                    Assunto: <br>
                    <input type="text" id="ipt_assunto"> <br><br>
                    Descrição: <br>
                    <input type="text" id="ipt_descricao"> <br><br>
                </div>
                <div id="botao-div">
                    <button id="abrir_chamado">Abrir Chamado</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
