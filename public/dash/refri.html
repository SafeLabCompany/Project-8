  <div id="page-container">

          </div>
        </div>
        <div class="areatabela_desativo" id="div_exibir_tabela">

              </tr>
            </thead>

                <td>Ana</td>

              <tr>

            </tbody>

        </div>

        <div class="arearefrigerador" id="div_exibir_grafico">
        </div>
      </div>
    </div>
    <footer style="padding: 1.5rem; background-color: #f8f9fa;">

      <!-- ------------- -->
      <!-- Parte de Cima -->
      <!-- ------------- -->

      <div style="display: flex; justify-content: space-between;">

            <span style="font-weight: bold; margin-left: -0.1rem;">Lab</span>
          </div>
        </div>

        <div style="display: flex; align-items: center;">
          <nav>
            <div style="word-spacing: 1rem;">
              <a onclick="contato_popup.showModal()"
                style="color:#1c1c1c; display: inline-block; cursor: pointer; text-decoration: none; transition: all 0.3s ease;">Contato</a>
              <a onclick="sobre_nos_popup.showModal()"

            </div>
          </nav>
        </div>
      </div>

      <!-- POPUPS -->
      <!-- ------ -->

      <dialog id="contato_popup">

      <!-- Parte de Baixo -->
      <!-- -------------- -->

      </div>
    </footer>
  </div>

<script>
  let tabela = false
  let grafico = true

  function alternar_vizualizacao() {
    if (grafico == true) {
      div_exibir_grafico.className = 'arearefrigerador_desativo'
      div_exibir_tabela.className = 'areatabela'
      grafico = false
      tabela = true
    } else {
      div_exibir_grafico.className = 'arearefrigerador'
      div_exibir_tabela.className = 'areatabela_desativo'
      grafico = true
      tabela = false
    }
  }

  let message = '';
  let ultimo_valor = 0

  for (let i = 1; i <= lista_unidade.length; i++) {
    message += `<option value="${i}">Unidade ${i}</option>`
  }

  slc_unidade.innerHTML = message

  message = '';

  for (let i = 0; i < unidade_1.length; i++) {
    if (i == 0) {
      ultimo_valor = sensor_1[5]
    } else if (i == 1) {
      ultimo_valor = sensor_2[5]
    } else if (i == 2) {
      ultimo_valor = sensor_3[5]
    } else if (i == 3) {
      ultimo_valor = sensor_4[5]
    } else if (i == 4) {
      ultimo_valor = sensor_5[5]
    } else if (i == 5) {
      ultimo_valor = sensor_6[5]
    }

    message += `
      <div class="refrigerador">
        <div class='titulo-card'>
          <div style='margin-left: 6px;'>
            Refrigerador - ${i + 1}
          </div>
          <div style='margin-right: 6px;' class="badge --${ultimo_valor < 8 && ultimo_valor > 2 && ultimo_valor != null ? 'ideal' : ultimo_valor == null ? 'desligado' : 'critical'}">
            ${ultimo_valor < 8 && ultimo_valor > 2 && ultimo_valor != null ? 'Ideal' : ultimo_valor == null ? 'Desligado' : 'Crítico'}
          </div>
        </div>
          <canvas class="refrigerador" id="refrigerador-${i}"></canvas>
        </div>
      </div>
    `;
  }

  div_exibir_grafico.innerHTML = message;

  var historico_temp = new Chart(
    document.getElementById(`refrigerador-0`).getContext("2d"),
