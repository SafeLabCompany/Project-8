<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Dashboard</title>
</head>

<body>
  <div id="user-area">
    <div id="user-img">
      <img src="../assets/userIcon.png">
    </div>
    Olá, <span id="user-name">usuário</span>

    <span id="user-call">Chamado</span>
  </div>
  <div id="area-dashboard">
    <div id="area-kpi">
      <div class="card-kpi">
        <span class="card-title">
          Última falha crítica
        </span>
        <span class="card-body">
          Há 5 minutos!
        </span>
        <span class="card-explain">
          Refrigeradores afetados: 8, 5
        </span>

      </div>
      <div class="card-kpi">
        <span class="card-title">
          Refrigerador mais instavél
        </span>
        <span class="card-body">
          7º Refrigerador
        </span>
        <span class="card-explain">
          10 ocorrências de instabilidade <br>
          nos últimos 15 dias
        </span>
      </div>

      <div class="card-kpi">
        <span class="card-title">
          ATENÇÃO
        </span>
        <span class="card-body">
          próximos a ultrapassagens da faixa
        </span>
        <span class="card-explain">
          0
        </span>
      </div>

    </div>

    <div id="dash">

    </div>
  </div>

</body>

</html>
