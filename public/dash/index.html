<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>

<body>
  <div id="user-area">
    <div id="user-img">
      <img src="../assets/userIcon.png">
    </div>
    Olá, <span id="user-name">usuário</span>
    <br>
    <div id="button-user">
    <span id="user-dash">Dashboard</span>
    <br>
    <span id="user-alertas">Alertas</span>
    <br>
    <span id="user-registros">Registros</span>
    <br>
    <span id="user-call">Chamado</span>
    <br>
    <span id="user-config">Configurações</span>
    <br><br>
    <span id="user-logout">Logout</span>
    </div>
  </div>
  <div id="area-dashboard">
    <div id="area-kpi">
      <div class="card-kpi1">
        <span id="kpi_1" >
          
          Última falha crítica
          <img id="img_alert" width="40px" src="../assets/alert_image-removebg-preview.png" alt="">
          
          </span>
          
        <span class="card-body">
          Há 5 minutos!
        </span>
        <span class="card-explain">
          Refrigeradores afetados: 8, 5
        </span>

      </div>
      <div class="card-kpi2">
        <span class="card-title">
          Refrigerador mais instavél
        </span>
        <span class="card-body">
          7º Refrigerador
        </span>
        <span class="card-explain">
          10 ocorrências de instabilidade <br>
          nos últimos 15 dias
        </span>
      </div>

      <div class="card-kpi3">
        <span class="card-title">
          ATENÇÃO
        </span>
        <span class="card-body">
          próximos a ultrapassagens da faixa
        </span>
        <span class="card-explain">
          0
        </span>
      </div>

    </div>

    <div id="dash">

    </div>
  </div>

</body>

</html>
