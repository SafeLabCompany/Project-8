    <script>
        function EntrarLogin() {
            let InsertEmail = ipt_LoginEmail.value;
            let InsertSenha = ipt_LoginSenha.value;

            if (InsertEmail == '') {
                alert('É necessario informar o seu email para seguir com o Login')
