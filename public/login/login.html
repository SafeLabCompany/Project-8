<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safelab | Login</title>
    <link rel="icon" type="image/png" href="../assets/institucional/safelab_recortada.svg">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="section_header">
            <img style="width: 1.25rem; margin-left: 1rem; margin-right: 1rem;"
                src="../assets/institucional/safelab_recortada.svg" alt="logo">
            <div class="texto_logo">
                <span style="font-weight: 200; letter-spacing: -0.1rem;">Safe</span>
                <span style="font-weight: bold; margin-left: -0.1rem;">Lab</span>
            </div>
        </div>

        <div class="section_header">
            <nav class="menu_navegacao">
                <div style="word-spacing: 1rem;">
                    <a style="color: #2b3b92;" href="../institucional/index.html#home" class="link_header">Inicio</a>
                    <a style="color: #2b3b92;" href="../institucional/index.html#about" class="link_header">Sobre</a>
                    <a style="color: #2b3b92;" href="../institucional/index.html#simulator"
                        class="link_header">Simulador</a>
                </div>
            </nav>
        </div>

        <div style="margin-right: 1rem;" class="section_header">
            <nav class="menu_navegacao">
                <div style="word-spacing: 1rem;">
                    <a href="login.html" class="link_header">Login</a>
                    <a href="../cadastro/cad.html" class="link_header">Cadastro</a>
                </div>
            </nav>
    </header>

    <section id="PaginaLogin" class="PaginaLogin">

        <div class="LoginImagem">
            <div>
                <img class="Logotipo" src="../assets/cadastro/ImagemCentralCadastro.png" alt="">
            </div>
        </div>

        <div class="AreaDoLogin">

            <div class="DivLogin" style="margin-top: 2rem;">
                <h2>Faça seu Login:</h2><br>
            </div>

            <div class="DivLogin">
                <label>
                    <h3>Email:</h3>
                </label>
                <input class="LocalDeInsert" type="text" id="ipt_LoginEmail" style="text-align: center;">
                <label>
                    <h3>Senha:</h3>
                </label>
                <input class="LocalDeInsert" type="password" id="ipt_LoginSenha" style="text-align: center;">
            </div>
            <div id="msg_erro"></div><br>
            <div>
                <button class="ButtonLogin" onclick="EntrarLogin()">Login</button>  
            </div>
        </div>

    </section>

    <footer style="padding: 1.5rem; background-color: #f8f9fa;">

        <div style="display: flex; justify-content: space-between;">
            <div style="display: flex; align-items: center;">
                <img style="width: 1.25rem; margin-left: 1rem; margin-right: 0.5rem;"
                    src="../assets/institucional/safelab_recortada.svg" alt="logo">
                <div style="display: flex; align-items: center; font-family: 'Montserrat'; font-size: 2rem;">
                    <span style="font-weight: 200; letter-spacing: -0.1rem;">Safe</span>
                    <span style="font-weight: bold; margin-left: -0.1rem;">Lab</span>
                </div>
            </div>

            <div style="display: flex; align-items: center;">
                <nav>
                    <div style="word-spacing: 1rem;">
                        <a href="../institucional/index.html#home"
                            style="display: inline-block; cursor: pointer; text-decoration: none; transition: all 0.3s ease;">Início</a>
                        <a onclick="contato_popup.showModal()"
                            style="display: inline-block; cursor: pointer; text-decoration: none; transition: all 0.3s ease;">Contato</a>
                    </div>
                </nav>
            </div>
        </div>


        <dialog id="contato_popup">
            <h2>Olá!</h2>
            <p>Este é um pop-up simples.</p>
            <button onclick="contato_popup.close()">Fechar</button>
        </dialog>


        <div>
            <hr style="height: 0.2rem; background-color: #1c1c1c;">

            <span style="margin-top: 1.5rem; display: flex; justify-content: center;"> © SafeLab - 2026 - Todos os
                direitos reservados.</span>
        </div>
    </footer>

    <script>
        function EntrarLogin() {
            var ax_Email = ipt_LoginEmail.value;
            var ax_Senha = ipt_LoginSenha.value;

            if (ax_Email == '') {
                alert('É necessario informar o seu email para seguir com o Login')
            }
            else if (ax_Senha == '') {
                alert('É necessario inserir uma senha válida para seguir com o Login')
            } else{

            fetch("/usuarios/autenticar", {
        method: 'POST',
        headers: {
                "Content-Type": "application/json"
            },
        body: JSON.stringify({
          
          Email: ax_Email,
          Senha: ax_Senha
          

        })
        }).then(function(resposta){
            if(resposta.ok){
          console.log(resposta);

          resposta.json().then(json => {
            console.log(json);
            console.log(JSON.stringify(json));
            sessionStorage.user_name = json.nome;
            sessionStorage.user_email = json.email;
            sessionStorage.user_id = json.id;
            sessionStorage.empresa_id = json.unidades[0].fk_empresa;
            sessionStorage.unidades = JSON.stringify(json.unidades);
            sessionStorage.nivel_id = JSON.stringify(json.unidades.id_nivel);
            var listaNiveis = [];
            for (var i = 0; i < json.unidades.length; i++) {
             listaNiveis.push(json.unidades[i].id_nivel);
            }
            sessionStorage.nivel_id = JSON.stringify(listaNiveis);
            

            setTimeout(function (){
              window.location = "../dash/dashboard.html"
            },1000)
          })
        }
        else {
            console.log("Houve um erro ao tentar realizar o login");
            resposta.text().then(texto =>{
              console.error(texto);
            });
          }
      })
    
        }
}
        

    </script>

</body>

</html>
