<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>
</head>
<body>
    
    <header>
        <div class="section_header">
            <img style="width: 1.25rem; margin-left: 1rem; margin-right: 1rem;" src="../assets/safelab_recortada.svg"
                alt="logo">
            <div class="texto_logo">
                <span style="font-weight: 200; letter-spacing: -0.1rem;">Safe</span>
                <span style="font-weight: bold; margin-left: -0.1rem;">Lab</span>
            </div>
        </div>

        <div class="section_header">
            <nav class="menu_navegacao">
                <div style="word-spacing: 1rem;">
                    <a style="color: #2b3b92;" href="#home" class="link_header">Inicio</a>
                    <a style="color: #2b3b92;" href="#about" class="link_header">Sobre</a>
                    <a style="color: #2b3b92;" href="#simulator" class="link_header">Simulador</a>
                </div>
            </nav>
        </div>

        <div style="margin-right: 1rem;" class="section_header">
            <nav class="menu_navegacao">
                <div style="word-spacing: 1rem;">
                    <a href="../login/index.html" class="link_header">Login</a>
                    <a href="../cadastro/index.html" class="link_header">Cadastro</a>
                </div>
            </nav>
    </header>

    <section id="PaginaCadastro" class="PaginaCadastro">
        
        <div class="CadastroImagem">
             <img class="Logotipo" src="../assets/ImagemCentralCadastro.png" alt="">
        </div>
        <!-- <div class="LogoTipoEmpresa">
            <img class="Logotipo" src="../assets/ImagemCentralCadastro.png" alt="">
        </div> -->
       
        <div class="AreaDoCadastro">
            <h2>Faça seu cadastro:</h2><br>
            <h3>Nome:<br>
                <input class="LocalDeInsert" type="text" id="ipt_CadastroNome">
            </h3><br>
            
            <h3>Email: <br> <input class="LocalDeInsert" type="text" id="ipt_CadastroEmail"></h3>
            <h3>Cpf: <br> <input class="LocalDeInsert" type="text" id="ipt_CadastroCpf"></h3>
            <h3>Senha: <br> <input class="LocalDeInsert" type="text" id="ipt_CadastroSenha"></h3>
            <h3>Confirmar Senha: <br> <input class="LocalDeInsert" type="text" id="ipt_CadastroConfirmarSenha"></h3><br>

            <button class="ButtonCadastrar" onclick="Cadastrar()">Cadastrar</button><br>
            <h3 style="font-weight: bold; font-size: 1.5rem;">Já possui conta?</h3>
            <button class="ButtonEntrar" onclick="Entrar()">Entrar!</button>

        </div>
    </section>

    <script>
function Cadastrar(){
    let InsertNome = ipt_CadastroNome.value;
    let InsertEmail = ipt_CadastroEmail.value;
    let InsertCpf = ipt_CadastroCpf.value;
    let InsertSenha = ipt_CadastroSenha.value;
    let InsertConfirmaSenha = ipt_CadastroConfirmarSenha.value;


    if(InsertNome ==''){
        alert('É necessario informar o seu nome para seguir com o cadastro')
    }

    else if (InsertEmail == ''){
        alert('É necessario informar o seu email para seguir com o cadastro')
    }
    else if (InsertCpf == '' || InsertCpf.length != 11){
        alert('É necessario informar o seu cpf para seguir com o cadastro, seu cpf precisar ter 11 digitos')
    }
    else if(InsertSenha == ''){
        alert('É necessario inserir uma senha para seguir com o cadastro')
    }
    else if(InsertConfirmaSenha == ''){
        alert('É necessario inserir a senha novamente para seguir com o cadastro')
    }
}




    </script>
    
</body>
</html>
