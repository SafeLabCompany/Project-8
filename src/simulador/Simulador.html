<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Calculadora de Estoque de Vacinas</h1>
        <h2>Configuração Inicial</h2>

        <div class="caixa_pai">

            <div class="vaccine-card">
                <div class="card-header">Informações do Estoque</div>
                <div class="card-body">
                    <div class="field-group">
                        <label>Selecione uma vacina:</label>
                        <select id="slc_vacina" onchange="verificar_outro()">
                            <option value="selecione" selected>Selecione...</option>
                            <option value="influenza">Influenza</option>
                            <option value="pentavalente">Pentavalente</option>
                            <option value="poliomielite">Poliomielite</option>
                            <option value="pneumococica">Pneumocócica 10-Valente</option>
                            <option value="triplice">Tríplice Viral</option>
                            <option value="bcg">BCG</option>
                            <option value="outro">Outro</option>
                        </select>
                    </div>

                    <div id="div_outro_1" class="field-group">
                    </div>

                    <div id="div_outro_2" class="field-group">
                    </div>

                    <div class="field-group">
                        <label>Quantidade Atual:</label>
                        <input type="number" id="ipt_qnt" placeholder="Ex: 10">
                    </div>
                </div>
            </div>

            <div class="result-box">
                <div id="div_resultado" class="result-totals">
                </div>
            </div>`

        </div>

        <button onclick="valor_vacinas()" class="btn-primary btn-calc">Calcular Perdas</button>
    </div>

    <script>
        function verificar_outro() {
            if (slc_vacina.value === 'outro') {
                div_outro_1.innerHTML = `<label>Informe o nome:</label>
                <input type="text" id="ipt_nome_outro" placeholder='Ex: Hepatite B'>`

                div_outro_2.innerHTML = `<label>Informe o valor unitário (R$):</label>
                <input type="number" id="ipt_valor_outro" placeholder='Ex: 2.50'>`
            } else {
                div_outro_1.innerHTML = ''
                div_outro_2.innerHTML = ''
            }
        }

        function valor_vacinas() {

            // definindo o valor de cada tipo de vacina:
            let valor_medio = 0
            let nome = slc_vacina.value

            if (nome == "influenza") {

                valor_medio = 45

            } else if (nome == "pentavalente") {

                valor_medio = 170

            } else if (nome == "poliomielite") {

                valor_medio = 225

            } else if (nome == "pneumococica") {

                valor_medio = 475

            } else if (nome == "triplice") {

                valor_medio = 130

            } else if (nome == "bcg") {

                valor_medio = 65

            } else if (nome == "outro") {

                valor_medio = Number(ipt_valor_outro.value)

            }

            // Realizando os calculos de acordo com as informações passadas:

            let quantidade = Number(ipt_qnt.value)
            let percentual_perda = 41.4

            if (nome == 'outro') {
                nome = ipt_nome_outro.value
            }

            if (nome == 'selecione') {
                div_resultado.innerHTML = '<b style="color: red">Selecione uma opção valida.</b>'
            } else if (quantidade <= 0) {
                div_resultado.innerHTML = '<b style="color: red">Insira um valor maior que 0 na quantidade.</b>'
            } else if (nome == '') {
                div_resultado.innerHTML = '<b style="color: red">Insira o nome da vacina desejada.</b>'
            } else if (valor_medio <= 0) {
                div_resultado.innerHTML = '<b style="color: red">Insira um valor de vacina maior do que 0.</b>'
            } else if (String(quantidade).includes('.')) {
                div_resultado.innerHTML = '<b style="color: red">Insira uma quantidade inteira.</b>'
            } else {
                let qnt_vacinas_perdidas = quantidade * (percentual_perda / 100)
                let qnt_reais_perdidos = qnt_vacinas_perdidas * valor_medio

                let reais_antes_perda = quantidade * valor_medio

                div_resultado.innerHTML = `
                        Para o estoque de ${quantidade} doses da Vacina ${nome}. <br>
                        Foi usado o valor de ${reais_antes_perda.toFixed(2)} reais na compra das vacinas. <br>
                        <br>
                        Caso ocorra uma quebra de cadeia fria neste momento: <br>
                        O total de vacinas que poderá ser perdido é de até <b>${qnt_vacinas_perdidas.toFixed(0)} doses </b> (41%). <br>
                        Que representará ${qnt_reais_perdidos.toFixed(2)} reais da compra. <br>
                        <br>
                        Sobrando apenas <b>${(quantidade - qnt_vacinas_perdidas).toFixed(0)} vacinas</b> no estoque.`;
            }
        }
    </script>

</body>

</html>
